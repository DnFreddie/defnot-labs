---
- hosts: all
  become: true
  tasks:
  - name: Add HashiCorp repository
    register: hashicorp_repo_status
    check_mode: true
    apt_repository:
      repo: "deb [arch=amd64] https://apt.releases.hashicorp.com noble main"
      state: present
      filename: hashicorp

  - name: Add Docker repository
    register: docker_repo_status
    check_mode: true
    apt_repository:
      repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu noble stable"
      state: present
      filename: docker

  - name: Verify that the repositories are installed
    fail:
      msg: "Repository verification failed"
    when: hashicorp_repo_status.changed or docker_repo_status.changed
